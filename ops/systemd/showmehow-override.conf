[Service]
Environment=SHOWMEHOW_TRUST_PROXY=1
ExecStart=
ExecStart=/usr/bin/npm start -- -H 127.0.0.1
# По SIGTERM веб закрывает потоки заданий и выходит за секунды. Если что-то всё же
# держит соединение, через 20 с придёт SIGKILL: генерацию ведёт воркер, а мастерская
# переподключится сама.
TimeoutStopSec=20
