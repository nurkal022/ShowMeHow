<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Орбита планеты</title>
<style>html, body { margin: 0; height: 100%; overflow: hidden; }</style>
</head>
<body>
<canvas id="scene"></canvas>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ==== @section physics ====
// Задача двух тел в единицах а.е. и лет: GM☉ = 4π² а.е.³/год². Скоростной Верле — энергия держится.
var PHYS = (function () {
  function acc(x, y, GM) { var r2 = x * x + y * y, r = Math.sqrt(r2) || 1e-9; return [-GM * x / (r2 * r), -GM * y / (r2 * r)]; }
  function init(p) { return { t: 0, x: p.r0, y: 0, vx: 0, vy: p.v0 * 2 * Math.PI / Math.sqrt(p.r0) * Math.sqrt(p.M), area: 0 }; }
  function step(s, p, dt) {
    var GM = 4 * Math.PI * Math.PI * p.M;
    SimPhys.substep(dt, 0.0005, function (h) {
      var a = acc(s.x, s.y, GM);
      var x0 = s.x, y0 = s.y;
      s.vx += a[0] * h / 2; s.vy += a[1] * h / 2;
      s.x += s.vx * h; s.y += s.vy * h;
      var b = acc(s.x, s.y, GM);
      s.vx += b[0] * h / 2; s.vy += b[1] * h / 2;
      s.area += 0.5 * Math.abs(x0 * s.y - y0 * s.x);
      s.t += h;
    });
  }
  function observe(s, p) {
    var GM = 4 * Math.PI * Math.PI * p.M, r = Math.hypot(s.x, s.y), v = Math.hypot(s.vx, s.vy);
    var E = v * v / 2 - GM / r, a = E < 0 ? -GM / (2 * E) : NaN;
    var L = s.x * s.vy - s.y * s.vx, e = Math.sqrt(Math.max(0, 1 + 2 * E * L * L / (GM * GM)));
    return { t: s.t, r: r, v: v, E: E, L: L, e: e, a: isFinite(a) ? a : 0, T: isFinite(a) ? Math.sqrt(a * a * a / p.M) : 0,
      x: s.x, y: s.y, vx: s.vx, vy: s.vy, phase: E < 0 ? 0 : 1 };
  }
  return { init: init, step: step, observe: observe };
})();
// ==== @end physics ====

// ==== @section state ====
var P = { M: 1, r0: 1, v0: 0.8 };
var S = PHYS.init(P);
var hooks = { frame: [], reset: [] };
// ==== @end state ====

// ==== @section scene ====
var v3 = SimUI.scene3d(THREE, OrbitControls, { radius: 1.15, grid: -0.25, view: [0.15, 0.8, 1] });
var sun = new THREE.Mesh(new THREE.SphereGeometry(0.12, 48, 24), new THREE.MeshStandardMaterial({ color: 0xffd36b, emissive: 0xffa200, emissiveIntensity: 1.1 }));
var glow = new THREE.PointLight(0xffc860, 2.5, 0, 0); sun.add(glow);
var planet = new THREE.Mesh(new THREE.SphereGeometry(0.045, 32, 16), new THREE.MeshStandardMaterial({ color: 0x5b9cff, roughness: 0.5 }));
v3.scene.add(sun, planet);
// Звёздный фон
var stars = new THREE.BufferGeometry(), sp = [];
for (var i = 0; i < 900; i++) { var u = Math.random() * 2 - 1, th = Math.random() * 6.283, R = 30; sp.push(R * Math.sqrt(1 - u * u) * Math.cos(th), R * u, R * Math.sqrt(1 - u * u) * Math.sin(th)); }
stars.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
v3.scene.add(new THREE.Points(stars, new THREE.PointsMaterial({ color: 0x8899bb, size: 0.06 })));
// След орбиты и «заметаемая площадь» (второй закон Кеплера)
var N = 600, trailPos = new Float32Array(N * 3), trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
var trailLine = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ color: 0x5b9cff, transparent: true, opacity: 0.7 }));
v3.scene.add(trailLine);
var trailN = 0;
hooks.reset.push(function () { trailN = 0; });
var sweepGeo = new THREE.BufferGeometry(), sweepPos = new Float32Array(120 * 9);
sweepGeo.setAttribute('position', new THREE.BufferAttribute(sweepPos, 3));
var sweep = new THREE.Mesh(sweepGeo, new THREE.MeshBasicMaterial({ color: 0xffa94d, transparent: true, opacity: 0.25, side: THREE.DoubleSide }));
v3.scene.add(sweep);
var sweepPts = [];
v3.label('Солнце', sun, { color: 'yellow', offset: [0, 0.2, 0] });
var tag = v3.label('', planet, { color: 'blue', offset: [0, 0.12, 0] });
var vArrow = v3.arrow([1, 0, 0], [1, 0, -0.3], 'green');
var fArrow = v3.arrow([1, 0, 0], [0.8, 0, 0], 'red');
function draw(o, P) {
  var px = o.x, pz = -o.y;
  planet.position.set(px, 0, pz);
  sun.scale.setScalar(0.7 + 0.3 * Math.cbrt(P.M));
  if (trailN < N) trailN++;
  trailPos.copyWithin(0, 3); trailPos[N * 3 - 3] = px; trailPos[N * 3 - 2] = 0; trailPos[N * 3 - 1] = pz;
  trailGeo.setDrawRange(N - trailN, trailN); trailGeo.attributes.position.needsUpdate = true;
  // площадь, заметённая радиус-вектором за последние ~0.15 года
  sweepPts.push([px, pz, o.t]); while (sweepPts.length > 2 && o.t - sweepPts[0][2] > 0.15) sweepPts.shift();
  sweepPos.fill(0);
  for (var k = 1; k < sweepPts.length && k < 120; k++) sweepPos.set([0, 0, 0, sweepPts[k - 1][0], 0, sweepPts[k - 1][1], sweepPts[k][0], 0, sweepPts[k][1]], (k - 1) * 9);
  sweepGeo.attributes.position.needsUpdate = true;
  vArrow.update([px, 0, pz], [px + o.vx * 0.06, 0, pz - o.vy * 0.06]);
  fArrow.update([px, 0, pz], [px - px / o.r * 0.25 / Math.max(0.3, o.r * o.r), 0, pz - pz / o.r * 0.25 / Math.max(0.3, o.r * o.r)]);
  tag.set('v = ' + o.v.toFixed(1) + ' а.е./год');
  v3.render();
}
// ==== @end scene ====

// ==== @section controls ====
SimUI.title('Орбита планеты');
SimUI.goals(['Орбита — эллипс, Солнце в фокусе', 'За равное время радиус заметает равные площади', 'Скорость определяет форму орбиты: эллипс, круг или уход']);
SimUI.params(P, [
  { name: 'v0', label: 'Начальная скорость (доля круговой)', min: 0.4, max: 1.5, step: 0.01, unit: '' },
  { name: 'r0', label: 'Начальное расстояние', min: 0.5, max: 1.5, step: 0.05, unit: 'а.е.' },
  { name: 'M', label: 'Масса звезды', min: 0.3, max: 3, step: 0.1, unit: 'M☉' },
]);
SimUI.presets([{ label: 'Круговая', values: { v0: 1 } }, { label: 'Вытянутая', values: { v0: 0.6 } }, { label: 'Уход', values: { v0: 1.45 } }]);
// ==== @end controls ====

// ==== @section instruments ====
SimUI.readouts({ r: { label: 'Расстояние', unit: 'а.е.' }, v: { label: 'Скорость', unit: 'а.е./год' }, e: { label: 'Эксцентриситет', digits: 2 },
  T: { label: 'Период', unit: 'лет', digits: 2 } });
SimUI.chart({ title: 'Расстояние и скорость', x: 't', y: ['r', 'v'], xLabel: 't, лет', series: [{ name: 'r, а.е.', color: 'blue' }, { name: 'v, а.е./год', color: 'green' }] });
SimUI.sweep({ title: 'Энергия от скорости', param: 'v0', y: 'E', xLabel: 'v₀', yLabel: 'E', corner: 'tl', height: 120 });
SimUI.banner({ items: [{ name: 'Замкнутая орбита', sub: 'энергия отрицательна — планета связана', color: 'blue' },
  { name: 'Уход в бесконечность', sub: 'энергия ≥ 0 — планета улетает', color: 'red' }], phase: 'phase' });
// ==== @end instruments ====

// ==== @section main ====
var app = SimUI.run({ physics: PHYS, P: P, S: S, draw: draw, hooks: hooks, speed: [0.1, 0.25, 0.5, 1] });
// ==== @end main ====
</script>
</body>
</html>
