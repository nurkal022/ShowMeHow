<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Электроны и две щели</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07090d; }
  #scene { position: fixed; top: 0; left: 0; display: block; z-index: 0; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<script>
(function () {
  'use strict';

  // ---------- Холст и раскладка ----------
  var cv = document.getElementById('scene');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var X0, XB, XS, PLATE_W, XH, XH1, CY, PX_PER_UM;
  var plate = document.createElement('canvas'); // накопленные попадания (рисуются один раз)
  var pctx = plate.getContext('2d');

  // ---------- Физика (приближение Френеля) ----------
  // Плоская волна электрона падает на две щели ширины a, разнесённые на d.
  // Амплитуда на экране на расстоянии L: ψ_j(y) = ∫_щель exp(iπ(y−s)²/(λL)) ds.
  var A_UM = 0.3;            // ширина щели, мкм (слайдер)
  var L_UM = 5e4;            // расстояние до экрана: 5 см
  var Y_UM = 2.2;            // половина рабочей высоты экрана, мкм
  var d = 1.0;               // расстояние между щелями, мкм (слайдер)
  var lamPm = 5;             // длина волны электрона, пм (слайдер)
  var rate = 250;            // электронов в секунду (слайдер)
  var detector = false;

  var NT = 960;              // точек теоретической кривой
  var pCoh = new Float64Array(NT), p1 = new Float64Array(NT), p2 = new Float64Array(NT);
  var cdfCoh = new Float64Array(NT), cdf1 = new Float64Array(NT), cdf2 = new Float64Array(NT);
  var NB = 240;              // корзин гистограммы
  var counts = new Float64Array(NB);
  var pBinCoh = new Float64Array(NB), pBinInc = new Float64Array(NB);
  var visTheory = 0;

  function yOf(i) { return -Y_UM + (i + 0.5) * (2 * Y_UM / NT); }

  function computeTheory() {
    var lamUm = lamPm * 1e-6;
    var k = Math.PI / (lamUm * L_UM);
    var M = 320, ds = A_UM / M;
    var i, m, s, ph;
    var tot = 0, t1 = 0, t2 = 0;
    for (i = 0; i < NT; i++) {
      var y = yOf(i);
      var r1 = 0, i1 = 0, r2 = 0, i2 = 0;
      for (m = 0; m < M; m++) {
        var off = -A_UM / 2 + (m + 0.5) * ds;
        s = -d / 2 + off; ph = k * (y - s) * (y - s);
        r1 += Math.cos(ph); i1 += Math.sin(ph);
        s = d / 2 + off; ph = k * (y - s) * (y - s);
        r2 += Math.cos(ph); i2 += Math.sin(ph);
      }
      p1[i] = r1 * r1 + i1 * i1;
      p2[i] = r2 * r2 + i2 * i2;
      pCoh[i] = (r1 + r2) * (r1 + r2) + (i1 + i2) * (i1 + i2);
      tot += pCoh[i]; t1 += p1[i]; t2 += p2[i];
    }
    var c = 0, c1 = 0, c2 = 0;
    for (i = 0; i < NT; i++) {
      c += pCoh[i] / tot; cdfCoh[i] = c;
      c1 += p1[i] / t1; cdf1[i] = c1;
      c2 += p2[i] / t2; cdf2[i] = c2;
    }
    // Вероятности по корзинам гистограммы
    var per = NT / NB;
    for (var b = 0; b < NB; b++) {
      var sc = 0, si = 0;
      for (var j = 0; j < per; j++) {
        var q = b * per + j;
        sc += pCoh[q] / tot;
        si += 0.5 * (p1[q] / t1 + p2[q] / t2);
      }
      pBinCoh[b] = sc; pBinInc[b] = si;
    }
    // Видность полос у центра картины: (Imax − Imin)/(Imax + Imin) в окрестности одного периода
    var fr = fringeUm(), lo = Infinity, hi = 0;
    for (i = 0; i < NT; i++) {
      if (Math.abs(yOf(i)) <= fr * 0.75) { lo = Math.min(lo, pCoh[i]); hi = Math.max(hi, pCoh[i]); }
    }
    visTheory = hi + lo > 0 ? (hi - lo) / (hi + lo) : 0;
  }

  function fringeUm() { return lamPm * 1e-6 * L_UM / d; }
  function energyKeV() {
    var pc = 1239.84193 / (lamPm * 1e-3) / 1000; // кэВ: pc = hc/λ, hc = 1239.84 эВ·нм
    var mc2 = 510.999;
    return Math.sqrt(pc * pc + mc2 * mc2) - mc2;
  }

  function sampleCdf(cdf) {
    var u = Math.random(), lo = 0, hi = NT - 1;
    while (lo < hi) { var mid = (lo + hi) >> 1; if (cdf[mid] < u) lo = mid + 1; else hi = mid; }
    return yOf(lo) + (Math.random() - 0.5) * (2 * Y_UM / NT);
  }

  // ---------- Раскладка ----------
  function layout() {
    var left = W > 900 ? 345 : 10, right = W > 900 ? 292 : 10;
    var span = W - left - right;
    X0 = left + 10;
    XB = X0 + span * 0.22;
    XS = X0 + span * 0.5;
    PLATE_W = Math.min(150, span * 0.2);
    XH = XS + PLATE_W + 14;
    XH1 = W - right - 6;
    CY = H * 0.5;
    PX_PER_UM = (H * 0.4) / Y_UM;
  }
  function yPx(um) { return CY + um * PX_PER_UM; }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
    plate.width = Math.round(PLATE_W * DPR); plate.height = Math.round(H * DPR);
    pctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    redrawPlate();
    draw();
  }

  // ---------- Попадания ----------
  var hits = [];             // {u, y} — u ∈ [0,1] поперёк пластины, y в мкм
  var MAXHITS = 60000;
  var nLeft = 0, nRight = 0;
  var flights = [];          // летящие электроны для анимации
  var emitAcc = 0;
  var t = 0, running = true, lastFrame = null;

  function plotHit(h) {
    var x = h.u * PLATE_W, y = yPx(h.y);
    pctx.fillStyle = 'rgba(130,235,255,0.8)';
    pctx.fillRect(x - 0.9, y - 0.9, 1.8, 1.8);
  }
  function redrawPlate() {
    pctx.clearRect(0, 0, PLATE_W, H);
    for (var i = 0; i < hits.length; i++) plotHit(hits[i]);
  }

  function registerHit(y, slit) {
    var h = { u: 0.04 + 0.92 * Math.random(), y: y };
    if (hits.length < MAXHITS) { hits.push(h); plotHit(h); }
    var b = Math.floor((y + Y_UM) / (2 * Y_UM) * NB);
    if (b >= 0 && b < NB) counts[b]++;
    if (slit === 0) nLeft++; else if (slit === 1) nRight++;
    recent.push({ x: XS + h.u * PLATE_W, y: yPx(y), age: 0 });
    if (recent.length > 40) recent.shift();
  }
  var recent = [];

  function emitOne() {
    var slit = -1, y;
    if (detector) {
      slit = Math.random() < 0.5 ? 0 : 1;
      y = sampleCdf(slit === 0 ? cdf1 : cdf2);
    } else {
      y = sampleCdf(cdfCoh);
    }
    if (flights.length < 60) {
      flights.push({ age: 0, y: y, slit: slit, done: false });
    } else {
      registerHit(y, slit);
    }
  }

  var FLY1 = 0.35, FLY2 = 0.4; // с: пушка → щели, щели → экран

  function step(dt) {
    t += dt;
    emitAcc += rate * dt;
    while (emitAcc >= 1) { emitAcc -= 1; emitOne(); }
    for (var i = flights.length - 1; i >= 0; i--) {
      var f = flights[i];
      f.age += dt;
      if (f.age >= FLY1 + FLY2) { registerHit(f.y, f.slit); flights.splice(i, 1); }
    }
    for (var j = 0; j < recent.length; j++) recent[j].age += dt;
    for (var s = 0; s < 2; s++) flash[s] = Math.max(0, flash[s] - dt * 4);
  }
  var flash = [0, 0];

  // ---------- Рисование ----------
  function draw() {
    ctx.fillStyle = '#07090d';
    ctx.fillRect(0, 0, W, H);

    var top = yPx(-Y_UM), bot = yPx(Y_UM);
    // ось
    ctx.strokeStyle = 'rgba(120,140,170,0.12)';
    ctx.setLineDash([3, 6]);
    ctx.beginPath(); ctx.moveTo(X0, CY); ctx.lineTo(XH1, CY); ctx.stroke();
    ctx.setLineDash([]);

    // электронная пушка
    ctx.fillStyle = '#1c2633';
    ctx.strokeStyle = '#3c4c63';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.rect(X0, CY - 22, 46, 44); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#4f8ff7';
    ctx.fillRect(X0 + 46, CY - 6, 10, 12);
    ctx.fillStyle = '#8b95a3';
    ctx.font = '12px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('пушка', X0 + 23, CY + 40);
    ctx.fillText(Math.round(energyKeV()) + ' кэВ', X0 + 23, CY + 55);

    // преграда с двумя щелями (вертикальный масштаб тот же, что у экрана)
    var s1a = yPx(-d / 2 - A_UM / 2), s1b = yPx(-d / 2 + A_UM / 2);
    var s2a = yPx(d / 2 - A_UM / 2), s2b = yPx(d / 2 + A_UM / 2);
    ctx.fillStyle = '#3a4352';
    ctx.fillRect(XB - 4, top - 20, 8, s1a - (top - 20));
    ctx.fillRect(XB - 4, s1b, 8, s2a - s1b);
    ctx.fillRect(XB - 4, s2b, 8, bot + 20 - s2b);
    ctx.fillStyle = '#8b95a3';
    ctx.fillText('две щели', XB, top - 28);

    // детекторы у щелей
    if (detector) {
      for (var s = 0; s < 2; s++) {
        var sy = s === 0 ? (s1a + s1b) / 2 : (s2a + s2b) / 2;
        var gl = flash[s];
        ctx.fillStyle = 'rgba(255,90,90,' + (0.35 + 0.65 * gl) + ')';
        ctx.beginPath(); ctx.arc(XB - 16, sy, 6 + 4 * gl, 0, Math.PI * 2); ctx.fill();
        if (gl > 0) {
          ctx.strokeStyle = 'rgba(255,120,120,' + gl * 0.8 + ')';
          ctx.beginPath(); ctx.arc(XB - 16, sy, 12 + 14 * (1 - gl), 0, Math.PI * 2); ctx.stroke();
        }
      }
      ctx.fillStyle = '#ff8080';
      ctx.fillText('детектор', XB - 16, bot + 40);
    }

    // экран: накопленные точки
    ctx.fillStyle = '#0e131b';
    ctx.fillRect(XS, top, PLATE_W, bot - top);
    ctx.drawImage(plate, 0, 0, plate.width, plate.height, XS, 0, PLATE_W, H);
    ctx.strokeStyle = '#2a3341';
    ctx.strokeRect(XS, top, PLATE_W, bot - top);
    ctx.fillStyle = '#8b95a3';
    ctx.fillText('экран (вид спереди)', XS + PLATE_W / 2, top - 28);
    // свежие попадания — вспышки
    for (var r = 0; r < recent.length; r++) {
      var rc = recent[r], al = Math.max(0, 1 - rc.age / 0.5);
      if (al <= 0) continue;
      ctx.fillStyle = 'rgba(200,250,255,' + al + ')';
      ctx.beginPath(); ctx.arc(rc.x, rc.y, 1.5 + 2.5 * al, 0, Math.PI * 2); ctx.fill();
    }

    // летящие электроны
    for (var i = 0; i < flights.length; i++) {
      var f = flights[i];
      if (f.age < FLY1) {
        var k = f.age / FLY1;
        var gx = X0 + 56 + (XB - X0 - 56) * k;
        glowDot(gx, CY, '120,200,255');
      } else {
        var k2 = (f.age - FLY1) / FLY2;
        if (detector) {
          var sy0 = yPx(f.slit === 0 ? -d / 2 : d / 2);
          if (k2 < 0.08) flash[f.slit] = 1;
          glowDot(XB + (XS - XB) * k2, sy0 + (yPx(f.y) - sy0) * k2, '255,170,150');
        } else {
          // без наблюдения — волна от обеих щелей сразу
          var rad = (XS - XB) * k2;
          ctx.strokeStyle = 'rgba(120,200,255,' + (0.5 * (1 - k2)) + ')';
          ctx.lineWidth = 1.2;
          for (var q = 0; q < 2; q++) {
            var cy = yPx(q === 0 ? -d / 2 : d / 2);
            ctx.beginPath(); ctx.arc(XB, cy, rad, -1.1, 1.1); ctx.stroke();
          }
        }
      }
    }

    // гистограмма и теоретическая кривая
    var total = 0, b, maxP = 0;
    for (b = 0; b < NB; b++) total += counts[b];
    var pb = detector ? pBinInc : pBinCoh;
    for (b = 0; b < NB; b++) maxP = Math.max(maxP, pBinCoh[b], pBinInc[b]);
    var wmax = XH1 - XH;
    var bh = (bot - top) / NB;
    // столбики по три корзины: меньше статистического шума на глаз
    ctx.fillStyle = 'rgba(79,143,247,0.6)';
    for (b = 0; b + 2 < NB; b += 3) {
      var c3 = counts[b] + counts[b + 1] + counts[b + 2];
      if (!c3 || !total) continue;
      var len = (c3 / 3 / total) / maxP * wmax * 0.92;
      ctx.fillRect(XH, top + b * bh, Math.min(wmax, len), Math.max(1, 3 * bh - 0.8));
    }
    ctx.strokeStyle = '#ffb84d';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (b = 0; b < NB; b++) {
      var x = XH + pb[b] / maxP * wmax * 0.92, y = top + (b + 0.5) * bh;
      if (b) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.stroke();
    ctx.strokeStyle = '#2a3341';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(XH, top); ctx.lineTo(XH, bot); ctx.stroke();
    ctx.fillStyle = '#8b95a3';
    ctx.textAlign = 'left';
    ctx.fillText('гистограмма', XH + 4, top - 28);
    ctx.fillStyle = '#ffb84d';
    ctx.fillText('— теория |ψ|²', XH + 4, top - 12);

    // масштаб по вертикали
    ctx.fillStyle = '#5c6675';
    ctx.textAlign = 'center';
    ctx.fillText('высота экрана ' + (2 * Y_UM).toFixed(1) + ' мкм · до экрана L = 5 см (не в масштабе)', (X0 + XH1) / 2, bot + 62);
  }

  function glowDot(x, y, rgb) {
    var g = ctx.createRadialGradient(x, y, 0, x, y, 9);
    g.addColorStop(0, 'rgba(' + rgb + ',0.95)');
    g.addColorStop(1, 'rgba(' + rgb + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fill();
  }

  // ---------- Сравнение с теорией ----------
  function similarity() {
    var total = 0, b;
    for (b = 0; b < NB; b++) total += counts[b];
    if (!total) return 0;
    var pb = detector ? pBinInc : pBinCoh, tv = 0;
    for (b = 0; b < NB; b++) tv += Math.abs(counts[b] / total - pb[b]);
    return (1 - 0.5 * tv) * 100;
  }
  function measuredVisibility() {
    // Видность по гистограмме в центральной области ±0.75 периода
    var fr = fringeUm(), lo = Infinity, hi = 0, total = 0, b;
    for (b = 0; b < NB; b++) total += counts[b];
    if (total < 1500) return null;
    // корзины объединяем по три, чтобы статистический шум не изображал полосы
    for (b = 0; b + 2 < NB; b += 3) {
      var y = -Y_UM + (b + 1.5) * 2 * Y_UM / NB;
      var c3 = counts[b] + counts[b + 1] + counts[b + 2];
      if (Math.abs(y) <= fr * 0.75) { lo = Math.min(lo, c3); hi = Math.max(hi, c3); }
    }
    if (!isFinite(lo)) return null;
    return hi + lo > 0 ? (hi - lo) / (hi + lo) : 0;
  }

  function clearScreen() {
    hits = []; counts = new Float64Array(NB); nLeft = 0; nRight = 0;
    flights = []; recent = []; emitAcc = 0;
    redrawPlate();
  }

  function updateUi() {
    var n = 0;
    for (var b = 0; b < NB; b++) n += counts[b];
    rN.set(n);
    rE.set(energyKeV());
    rFr.set(fringeUm() * 1000);
    rVisT.set(detector ? 0 : visTheory);
    var vm = measuredVisibility();
    rVisM.set(vm === null ? 'мало данных' : vm.toFixed(2));
    rSim.set(similarity());
    rLR.set(detector ? nLeft + ' / ' + nRight : 'неизвестно');
    formula.set({ lambda: lamPm + ' пм', L: '5 см', d: d + ' мкм', dy: (fringeUm() * 1000).toFixed(0) + ' нм' });
  }

  function onGeometry() {
    computeTheory();
    clearScreen();
    updateUi();
    draw();
  }

  var lastUi = -1;
  function loop(now) {
    if (lastFrame == null) lastFrame = now;
    var dt = Math.min(0.05, (now - lastFrame) / 1000) * speedCtl.get();
    lastFrame = now;
    if (running) {
      step(dt);
      draw();
      if (now - lastUi > 150) { lastUi = now; updateUi(); }
    }
    requestAnimationFrame(loop);
  }

  function resetSim() {
    t = 0; lastFrame = null;
    clearScreen();
    updateUi();
    draw();
  }

  // ---------- SimUI ----------
  SimUI.title('Электроны и две щели');
  SimUI.goals([
    'Каждый электрон попадает в одну точку — как частица',
    'Тысячи попаданий складываются в интерференционные полосы — как волна',
    'Включите детектор у щелей: «какой путь» известен — полосы исчезают',
    'Период полос Δy = λL/d: проверьте слайдерами',
  ]);
  SimUI.slider({ name: 'd', label: 'Расстояние между щелями d', min: 0.6, max: 2, step: 0.05, value: d, unit: 'мкм',
    onChange: function (v) { d = v; onGeometry(); } });
  SimUI.slider({ name: 'a', label: 'Ширина щели a', min: 0.15, max: 0.6, step: 0.01, value: A_UM, unit: 'мкм',
    onChange: function (v) { A_UM = v; onGeometry(); } });
  SimUI.slider({ name: 'lambda', label: 'Длина волны электрона λ', min: 3, max: 10, step: 0.1, value: lamPm, unit: 'пм',
    onChange: function (v) { lamPm = v; onGeometry(); } });
  SimUI.slider({ name: 'rate', label: 'Темп пушки', min: 5, max: 1500, step: 5, value: rate, unit: 'эл/с',
    onChange: function (v) { rate = v; } });
  SimUI.toggle({ name: 'detector', label: 'Детектор «какой путь» у щелей', value: false,
    onChange: function (on) { detector = on; clearScreen(); updateUi(); draw(); } });
  SimUI.presets({ items: [
    { label: 'Классика', values: { d: 1, a: 0.3, lambda: 5, rate: 250 } },
    { label: 'Узкие полосы', values: { d: 1.8, a: 0.2, lambda: 4, rate: 400 } },
    { label: 'Широкие полосы', values: { d: 0.7, a: 0.2, lambda: 8, rate: 400 } },
  ] });
  var speedCtl = SimUI.speed({ values: [0.25, 0.5, 1, 2, 4], value: 1 });
  SimUI.playPause({
    onPlay: function () { running = true; lastFrame = null; },
    onPause: function () { running = false; },
    onReset: resetSim,
  });

  var formula = SimUI.formula({
    title: 'Период интерференционных полос',
    tex: '\\Delta y = \\frac{\\lambda L}{d},\\qquad \\lambda = \\frac{h}{p}',
    vars: { lambda: { label: 'λ' }, L: { label: 'L' }, d: { label: 'd' }, dy: { label: 'Δy' } },
    note: 'Вероятность попадания ∝ |ψ₁ + ψ₂|². С детектором слагаемые не интерферируют: |ψ₁|² + |ψ₂|².',
    corner: 'tl',
  });
  var rN = SimUI.readout({ label: 'Электронов на экране', unit: '', digits: 0, corner: 'bl' });
  var rE = SimUI.readout({ label: 'Энергия электрона', unit: 'кэВ', digits: 1, corner: 'bl' });
  var rFr = SimUI.readout({ label: 'Период полос Δy', unit: 'нм', digits: 0, corner: 'bl' });
  var rVisT = SimUI.readout({ label: 'Видность полос (теория)', unit: '', digits: 2, corner: 'bl' });
  var rVisM = SimUI.readout({ label: 'Видность полос (опыт)', unit: '', corner: 'bl' });
  var rSim = SimUI.readout({ label: 'Совпадение с теорией', unit: '%', digits: 1, corner: 'bl' });
  var rLR = SimUI.readout({ label: 'Через левую / правую щель', unit: '', corner: 'bl' });

  SimUI.expose({
    getState: function () {
      var n = 0;
      for (var b = 0; b < NB; b++) n += counts[b];
      return { t: t, electrons: n, inFlight: flights.length, fringeNm: fringeUm() * 1000,
        energyKeV: energyKeV(), visibility: detector ? 0 : visTheory, similarity: similarity(),
        detector: detector };
    },
    reset: resetSim,
  });

  // ---------- Старт ----------
  computeTheory();
  window.addEventListener('resize', resize);
  resize();
  updateUi();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
