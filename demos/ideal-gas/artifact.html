<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Идеальный газ: давление, объём, температура</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f16; }
  canvas.scene { position: fixed; top: 0; left: 0; display: block; }
  #info-panel {
    position: fixed; left: 12px; bottom: 12px; z-index: 10;
    width: 300px; padding: 14px;
    background: color-mix(in srgb, var(--sim-panel, #1a2029) 92%, transparent);
    border: 1px solid #2a3341; border-radius: 12px; backdrop-filter: blur(6px);
    color: var(--sim-text, #e8ecf1); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  #info-panel h2 { font-size: 13px; margin: 0 0 8px; color: var(--sim-muted, #8b95a3); font-weight: 600; }
  #formula-katex { font-size: 17px; margin-bottom: 8px; }
  #info-nums { font-size: 12px; line-height: 1.7; color: var(--sim-muted, #8b95a3); font-variant-numeric: tabular-nums; }
  #info-nums b { color: var(--sim-text, #e8ecf1); font-weight: 600; }
  #info-nums .row { display: flex; justify-content: space-between; gap: 10px; }
  #info-nums .ok { color: #7ee787; }
  #info-nums .warn { color: #ffb199; }
  #vessel-label {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    z-index: 5; color: var(--sim-muted, #8b95a3); font-family: system-ui, sans-serif;
    font-size: 13px; pointer-events: none; text-align: center;
  }
</style>
</head>
<body>
<canvas id="scene" class="scene"></canvas>

<div id="vessel-label">Сосуд с газом: поршень сверху задаёт объём</div>

<div id="info-panel" data-role="hud"
     data-p-measured="0" data-p-theory="0" data-volume="0" data-temperature="0" data-diff-pct="0">
  <h2>Уравнение состояния идеального газа</h2>
  <div id="formula-katex">PV = NkT</div>
  <div id="info-nums">
    <div class="row"><span>N (частиц)</span><b id="valN">-</b></div>
    <div class="row"><span>k (усл. ед.)</span><b id="valK">-</b></div>
    <div class="row"><span>T</span><b id="valT">-</b></div>
    <div class="row"><span>V</span><b id="valV">-</b></div>
    <div class="row"><span>P измерено</span><b id="valPm">-</b></div>
    <div class="row"><span>P теория (NkT/V)</span><b id="valPt">-</b></div>
    <div class="row"><span>Расхождение</span><b id="valDiff">-</b></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------- KaTeX (с деградацией в текст, если CDN недоступен) ----------
  function renderFormula(el, tex) {
    if (typeof katex !== 'undefined') {
      try { katex.render(tex, el, { throwOnError: false }); return; } catch (e) { /* fall through */ }
    }
    el.textContent = tex;
  }
  renderFormula(document.getElementById('formula-katex'), 'PV = NkT');

  // ---------- Canvas ----------
  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  // ---------- Физические константы (условные единицы, не СИ) ----------
  var N_PARTICLES = 400;
  var PARTICLE_RADIUS = 3;
  var MASS = 1;           // масса частицы, усл. ед.
  var K_B = 54;            // "постоянная Больцмана" в условных единицах демо,
                            // подобрана так, чтобы P(изм.) и P(теор.) совпадали по порядку
  var PISTON_SPEED = 260;  // px/с — максимальная скорость плавного движения поршня
  var PRESSURE_TAU = 0.5;  // с — окно скользящего среднего давления

  var DEFAULT_VOLUME_PCT = 65; // %
  var DEFAULT_T = 300;         // K

  // ---------- Геометрия сосуда ----------
  var box = { left: 0, width: 0, bottom: 0, heightMax: 0 };

  function computeGeometry() {
    box.width = Math.max(240, Math.min(480, W * 0.34));
    box.heightMax = Math.max(200, Math.min(360, H * 0.5));
    box.left = W * 0.5 - box.width / 2;
    box.bottom = Math.min(H - 40, H * 0.78);
  }

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    // сохраняем текущую долю объёма, чтобы resize не «телепортировал» поршень
    var prevHeightMax = box.heightMax;
    var heightFrac = prevHeightMax > 0 ? currentHeight / prevHeightMax : targetVolumeFrac;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    computeGeometry();
    currentHeight = heightFrac * box.heightMax;
    pistonY = box.bottom - currentHeight;
    // не даём частицам оказаться вне нового сосуда после resize
    if (particles) clampAllIntoBox();
  }

  // ---------- Состояние симуляции ----------
  var T = DEFAULT_T;                          // текущая температура, K
  var targetVolumeFrac = DEFAULT_VOLUME_PCT / 100; // целевая доля объёма 0.3..1.0 (из слайдера)
  var currentHeight = 0;   // высота газовой полости (px), обновляется в step()/resize()
  var pistonY = 0;         // y-координата верхней грани поршня (движущаяся стенка)

  var particles = null;
  var running = true;
  var needsRedraw = true;  // перерисовать кадр в паузе (сброс, слайдер, ресайз)
  var lastFrame = null;

  var pMeasured = 0; // скользящее среднее измеренного давления
  var pTheory = 0;

  // ---------- Максвелл-больцмановская выборка скоростей (2D) ----------
  // Каждая компонента скорости независима и нормально распределена с
  // дисперсией kT/m — тогда <v^2> = 2kT/m, что и требует равнораспределение в 2D.
  function gaussianRandom(sigma) {
    var u1 = Math.random() || 1e-12;
    var u2 = Math.random();
    var mag = Math.sqrt(-2 * Math.log(u1));
    return mag * Math.cos(2 * Math.PI * u2) * sigma;
  }

  function spawnParticles() {
    var sigma = Math.sqrt(K_B * T / MASS);
    var arr = new Array(N_PARTICLES);
    for (var i = 0; i < N_PARTICLES; i++) {
      arr[i] = {
        x: box.left + PARTICLE_RADIUS + Math.random() * (box.width - 2 * PARTICLE_RADIUS),
        y: pistonY + PARTICLE_RADIUS + Math.random() * (currentHeight - 2 * PARTICLE_RADIUS),
        vx: gaussianRandom(sigma),
        vy: gaussianRandom(sigma),
      };
    }
    return arr;
  }

  function rescaleVelocities(oldT, newT) {
    if (!particles || oldT <= 0) return;
    var factor = Math.sqrt(newT / oldT);
    for (var i = 0; i < particles.length; i++) {
      particles[i].vx *= factor;
      particles[i].vy *= factor;
    }
  }

  function clampAllIntoBox() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x = Math.min(box.left + box.width - PARTICLE_RADIUS, Math.max(box.left + PARTICLE_RADIUS, p.x));
      p.y = Math.min(box.bottom - PARTICLE_RADIUS, Math.max(pistonY + PARTICLE_RADIUS, p.y));
    }
  }

  // ---------- Столкновения со стенками (упругие, зеркальное отражение) ----------
  // Поршень трактуется как стенка в квазистатическом (изотермическом) приближении:
  // при столкновении меняется только знак нормальной компоненты скорости, её модуль
  // сохраняется — поэтому температура определяется исключительно слайдером «Температура»,
  // а на давление влияет только геометрия (объём), как и требует PV = NkT.
  function resolveWalls(p, pistonYNow) {
    var r = PARTICLE_RADIUS;
    var impulse = 0;

    if (p.x - r < box.left) {
      p.x = box.left + r;
      if (p.vx < 0) { impulse += 2 * MASS * Math.abs(p.vx); p.vx = -p.vx; }
    } else if (p.x + r > box.left + box.width) {
      p.x = box.left + box.width - r;
      if (p.vx > 0) { impulse += 2 * MASS * Math.abs(p.vx); p.vx = -p.vx; }
    }

    if (p.y + r > box.bottom) {
      p.y = box.bottom - r;
      if (p.vy > 0) { impulse += 2 * MASS * Math.abs(p.vy); p.vy = -p.vy; }
    } else if (p.y - r < pistonYNow) {
      p.y = pistonYNow + r;
      if (p.vy < 0) { impulse += 2 * MASS * Math.abs(p.vy); p.vy = -p.vy; }
    }

    return impulse;
  }

  var SUBSTEPS = 4;

  function step(dt) {
    if (dt <= 0) return; // избегаем деления на ноль в первом кадре (dt=0)
    // --- плавное движение поршня к целевому объёму, без телепортации ---
    var targetHeight = targetVolumeFrac * box.heightMax;
    var maxDelta = PISTON_SPEED * dt;
    var oldHeight = currentHeight;
    if (Math.abs(targetHeight - currentHeight) <= maxDelta) {
      currentHeight = targetHeight;
    } else {
      currentHeight += Math.sign(targetHeight - currentHeight) * maxDelta;
    }
    var oldPistonY = box.bottom - oldHeight;
    var newPistonY = box.bottom - currentHeight;

    var frameImpulse = 0;
    var sdt = dt / SUBSTEPS;
    for (var s = 0; s < SUBSTEPS; s++) {
      var pistonYNow = oldPistonY + (newPistonY - oldPistonY) * ((s + 1) / SUBSTEPS);
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.x += p.vx * sdt;
        p.y += p.vy * sdt;
        frameImpulse += resolveWalls(p, pistonYNow);
      }
    }
    pistonY = newPistonY;

    // 2D-модель: «давление» = импульс/(время·длина границы), т.е. сила на единицу длины,
    // а не на единицу площади — размерность честная (в 2D периметр играет роль площади в 3D).
    var perimeter = 2 * (box.width + currentHeight);
    var instant = frameImpulse / (perimeter * dt);
    var alpha = 1 - Math.exp(-dt / PRESSURE_TAU);
    pMeasured += alpha * (instant - pMeasured);

    var area = box.width * currentHeight;
    pTheory = (N_PARTICLES * K_B * T) / area;
  }

  // ---------- Отрисовка ----------
  function speedColor(v, vrms) {
    var t = Math.max(0, Math.min(1, v / (2.2 * vrms)));
    var r = Math.round(70 + t * 185);
    var g = Math.round(150 - t * 90);
    var b = Math.round(240 - t * 170);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0b0f16';
    ctx.fillRect(0, 0, W, H);

    // штриховка «снаружи» над поршнем
    ctx.save();
    ctx.beginPath();
    ctx.rect(box.left - 30, box.bottom - box.heightMax - 60, box.width + 60, box.heightMax + 60 - currentHeight);
    ctx.clip();
    ctx.strokeStyle = 'rgba(139,149,163,0.18)';
    ctx.lineWidth = 1;
    for (var lx = box.left - 90; lx < box.left + box.width + 90; lx += 14) {
      ctx.beginPath();
      ctx.moveTo(lx, box.bottom - box.heightMax - 60);
      ctx.lineTo(lx + 60, box.bottom + 10);
      ctx.stroke();
    }
    ctx.restore();

    // стенки сосуда (левая, правая, дно)
    ctx.strokeStyle = 'rgba(232,236,241,0.7)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(box.left, pistonY);
    ctx.lineTo(box.left, box.bottom);
    ctx.lineTo(box.left + box.width, box.bottom);
    ctx.lineTo(box.left + box.width, pistonY);
    ctx.stroke();

    // частицы
    var vrms = Math.sqrt(2 * K_B * T / MASS);
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
      ctx.beginPath();
      ctx.fillStyle = speedColor(speed, vrms);
      ctx.arc(p.x, p.y, PARTICLE_RADIUS, 0, Math.PI * 2);
      ctx.fill();
    }

    // поршень (подвижная стенка сверху)
    var pistonH = 14;
    ctx.fillStyle = '#4a5568';
    ctx.fillRect(box.left - 6, pistonY - pistonH, box.width + 12, pistonH);
    ctx.strokeStyle = '#8b95a3';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(box.left - 6, pistonY - pistonH, box.width + 12, pistonH);
    // шток поршня
    ctx.fillStyle = '#8b95a3';
    ctx.fillRect(box.left + box.width / 2 - 4, Math.max(0, pistonY - pistonH - 40), 8, 40);

    ctx.font = '12px system-ui, sans-serif';
    ctx.fillStyle = '#8b95a3';
    ctx.fillText('поршень (объём)', box.left + box.width + 14, pistonY + 4);
  }

  // ---------- HUD ----------
  var hud = document.getElementById('info-panel');
  var elN = document.getElementById('valN');
  var elK = document.getElementById('valK');
  var elT = document.getElementById('valT');
  var elV = document.getElementById('valV');
  var elPm = document.getElementById('valPm');
  var elPt = document.getElementById('valPt');
  var elDiff = document.getElementById('valDiff');

  function updateHud() {
    var area = box.width * currentHeight;
    var diffPct = pTheory > 0 ? ((pMeasured - pTheory) / pTheory) * 100 : 0;

    elN.textContent = N_PARTICLES;
    elK.textContent = K_B.toFixed(0);
    elT.textContent = T.toFixed(0) + ' K';
    elV.textContent = area.toFixed(0) + ' у.е.';
    elPm.textContent = pMeasured.toFixed(1) + ' у.е.';
    elPt.textContent = pTheory.toFixed(1) + ' у.е.';
    elDiff.textContent = (diffPct >= 0 ? '+' : '') + diffPct.toFixed(1) + '%';
    elDiff.className = Math.abs(diffPct) <= 15 ? 'ok' : 'warn';

    hud.setAttribute('data-p-measured', pMeasured.toFixed(3));
    hud.setAttribute('data-p-theory', pTheory.toFixed(3));
    hud.setAttribute('data-volume', area.toFixed(3));
    hud.setAttribute('data-temperature', T.toFixed(3));
    hud.setAttribute('data-diff-pct', diffPct.toFixed(2));
  }

  // ---------- Главный цикл ----------
  function loop(now) {
    if (lastFrame == null) lastFrame = now;
    var dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;

    if (running) step(dt);
    // В паузе полотно не перерисовываем: даже одинаковая по содержанию
    // перерисовка заставляет композитор пересчитывать backdrop-фильтр панелей,
    // и кадр «дрожит» на уровне единиц яркости.
    if (running || needsRedraw) { draw(); updateHud(); needsRedraw = false; }
    requestAnimationFrame(loop);
  }

  // ---------- SimUI ----------
  SimUI.title('Идеальный газ: давление, объём, температура');
  SimUI.slider({
    label: 'Объём', min: 30, max: 100, step: 1, value: DEFAULT_VOLUME_PCT, unit: '%',
    onChange: function (v) { targetVolumeFrac = v / 100; needsRedraw = true; },
  });
  SimUI.slider({
    label: 'Температура', min: 100, max: 600, step: 10, value: DEFAULT_T, unit: 'K',
    onChange: function (v) {
      var newT = v;
      rescaleVelocities(T, newT);
      T = newT;
      needsRedraw = true;
    },
  });
  SimUI.playPause({
    onPlay: function () { running = true; lastFrame = null; },
    onPause: function () { running = false; },
    onReset: function () {
      // слайдеры (T, V) не трогаем — частицы просто пересоздаются
      // при текущих значениях температуры и объёма
      currentHeight = targetVolumeFrac * box.heightMax;
      pistonY = box.bottom - currentHeight;
      particles = spawnParticles();
      pMeasured = pTheory;
      needsRedraw = true;
    },
  });

  // ---------- Инициализация ----------
  window.addEventListener('resize', function () { resize(); needsRedraw = true; });
  W = window.innerWidth;
  H = window.innerHeight;
  computeGeometry();
  currentHeight = targetVolumeFrac * box.heightMax;
  pistonY = box.bottom - currentHeight;
  particles = spawnParticles();
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
