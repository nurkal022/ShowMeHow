<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Математический маятник</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101318; }
  canvas.scene { position: fixed; top: 0; left: 0; display: block; }
  #bg { z-index: 0; }
  #fx { z-index: 1; }
</style>
</head>
<body>
<canvas id="bg" class="scene"></canvas>
<canvas id="fx" class="scene"></canvas>

<script>
(function () {
  'use strict';

  // ---------- Canvas setup ----------
  var bg = document.getElementById('bg');
  var fx = document.getElementById('fx');
  var bgCtx = bg.getContext('2d');
  var fxCtx = fx.getContext('2d');

  var W = 0, H = 0;
  var pivot = { x: 0, y: 0 };
  var PPM = 140; // пикселей на метр (пересчитывается при resize)

  // ---------- Геометрия сцены: точка подвеса вверху по центру ----------
  // Панели кита пристыкованы к углам, поэтому центр окна свободен под сцену.
  function layout() {
    pivot.x = W * 0.5;
    pivot.y = Math.max(70, H * 0.12);
    var availH = H - pivot.y - 40;
    PPM = Math.max(60, Math.min(220, availH / 3.3)); // хватает места для L до 3м
  }

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    [bg, fx].forEach(function (c) {
      c.width = Math.round(W * dpr);
      c.height = Math.round(H * dpr);
      c.style.width = W + 'px';
      c.style.height = H + 'px';
    });
    bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();
    drawStatic();
    fxCtx.clearRect(0, 0, W, H);
  }

  // ---------- Статичная сцена: крепление и линия равновесия ----------
  function drawStatic() {
    bgCtx.clearRect(0, 0, W, H);
    bgCtx.fillStyle = '#101318';
    bgCtx.fillRect(0, 0, W, H);

    var ceilingY = Math.max(0, pivot.y - 8);
    bgCtx.fillStyle = '#1a2029';
    bgCtx.fillRect(0, 0, W, ceilingY);
    bgCtx.strokeStyle = '#2a3341';
    bgCtx.lineWidth = 2;
    bgCtx.beginPath();
    bgCtx.moveTo(0, ceilingY);
    bgCtx.lineTo(W, ceilingY);
    bgCtx.stroke();

    // штриховка кронштейна над точкой подвеса
    bgCtx.strokeStyle = 'rgba(140,160,190,0.35)';
    bgCtx.lineWidth = 1.4;
    var hatchN = 7, hatchSpan = 46;
    for (var i = -hatchN; i <= hatchN; i++) {
      var hx = pivot.x + i * (hatchSpan / hatchN);
      bgCtx.beginPath();
      bgCtx.moveTo(hx, ceilingY);
      bgCtx.lineTo(hx - 8, ceilingY - 10);
      bgCtx.stroke();
    }

    // вертикальная пунктирная линия положения равновесия (θ=0)
    bgCtx.save();
    bgCtx.setLineDash([5, 6]);
    bgCtx.strokeStyle = 'rgba(140,160,190,0.28)';
    bgCtx.lineWidth = 1.4;
    bgCtx.beginPath();
    bgCtx.moveTo(pivot.x, pivot.y);
    bgCtx.lineTo(pivot.x, H - 20);
    bgCtx.stroke();
    bgCtx.restore();

    bgCtx.fillStyle = '#5c6675';
    bgCtx.font = '13px system-ui, sans-serif';
    bgCtx.fillText('маятник (боковой вид)', 14, H - 14);
  }

  // ---------- Физика: θ'' = -(g/L)sinθ - bθ' ----------
  var G = 9.81;
  var L = 1.5;        // м, слайдер "Длина нити"
  var ampDeg0 = 45;    // °, слайдер "Начальная амплитуда" — применяется только при сбросе
  var damping = 0.05;  // слайдер "Затухание"

  var theta = ampDeg0 * Math.PI / 180;
  var omega = 0;
  var thetaPrev = theta;

  var FIXED_H = 0.004; // фиксированный субшаг интегрирования, с
  var accumulator = 0;
  var running = true;
  var simT = 0;
  var lastFrame = null;

  var lastPosCrossT = null; // время последнего перехода θ через 0 в сторону возрастания
  var measuredPeriod = null;

  function energies() {
    var v = L * omega; // тангенциальная скорость груза, м/с (масса = 1 кг)
    var Ek = 0.5 * v * v;
    var Ep = G * L * (1 - Math.cos(theta));
    return { Ek: Ek, Ep: Ep, Et: Ek + Ep };
  }

  /** Амплитуда текущего размаха из полной энергии: cos θmax = 1 − E/(gL). */
  function amplitudeDeg() {
    var c = 1 - energies().Et / (G * L);
    return Math.acos(Math.max(-1, Math.min(1, c))) * 180 / Math.PI;
  }

  /** Период малых колебаний по формуле T = 2π√(L/g). */
  function theoreticalPeriod() { return 2 * Math.PI * Math.sqrt(L / G); }

  function substep() {
    // полунеявный (симплектический) метод Эйлера: сначала скорость, потом угол
    // на уже обновлённой скорости — это и даёт отсутствие векового роста энергии.
    var alpha = -(G / L) * Math.sin(theta) - damping * omega;
    omega += alpha * FIXED_H;
    thetaPrev = theta;
    theta += omega * FIXED_H;
    simT += FIXED_H;
    if (thetaPrev < 0 && theta >= 0) {
      if (lastPosCrossT !== null) measuredPeriod = simT - lastPosCrossT;
      lastPosCrossT = simT;
    }
  }

  function stepPhysics(dt) {
    accumulator += dt;
    if (accumulator > 0.25) accumulator = 0.25; // защита от "спирали смерти"
    while (accumulator >= FIXED_H) {
      substep();
      accumulator -= FIXED_H;
    }
  }

  function resetSim() {
    theta = ampDeg0 * Math.PI / 180;
    omega = 0;
    thetaPrev = theta;
    accumulator = 0;
    simT = 0;
    lastFrame = null;
    lastPosCrossT = null;
    measuredPeriod = null;
    lastChartT = -1;
    energyChart.clear();
    fxCtx.clearRect(0, 0, W, H);
  }

  // ---------- Отрисовка маятника (нить, груз, лёгкий след) ----------
  function bobPos() {
    // геометрия зависит только от текущих θ, L и PPM — при смене длины на лету
    // угол/скорость не трогаются, поэтому "телепорта" положения не возникает,
    // груз просто оказывается на другом радиусе от той же точки подвеса.
    return { x: pivot.x + Math.sin(theta) * L * PPM, y: pivot.y + Math.cos(theta) * L * PPM };
  }

  function drawFrame() {
    // лёгкое затухание предыдущего кадра -> едва заметный след траектории груза
    fxCtx.globalCompositeOperation = 'destination-out';
    fxCtx.fillStyle = 'rgba(0,0,0,0.06)';
    fxCtx.fillRect(0, 0, W, H);
    fxCtx.globalCompositeOperation = 'source-over';

    var bob = bobPos();

    fxCtx.strokeStyle = '#8b95a3';
    fxCtx.lineWidth = 2;
    fxCtx.beginPath();
    fxCtx.moveTo(pivot.x, pivot.y);
    fxCtx.lineTo(bob.x, bob.y);
    fxCtx.stroke();

    fxCtx.fillStyle = '#e8ecf1';
    fxCtx.beginPath();
    fxCtx.arc(pivot.x, pivot.y, 4, 0, Math.PI * 2);
    fxCtx.fill();

    var grad = fxCtx.createRadialGradient(bob.x - 5, bob.y - 5, 2, bob.x, bob.y, 16);
    grad.addColorStop(0, '#8fb4ff');
    grad.addColorStop(1, '#3a66c9');
    fxCtx.fillStyle = grad;
    fxCtx.beginPath();
    fxCtx.arc(bob.x, bob.y, 14, 0, Math.PI * 2);
    fxCtx.fill();
    fxCtx.strokeStyle = '#1c3a7a';
    fxCtx.lineWidth = 1.5;
    fxCtx.stroke();
  }

  // ---------- Точка графика не чаще ~10 Гц ----------
  var CHART_DT = 0.1;
  var lastChartT = -1;

  // ---------- Главный цикл (dt-based, не завязан на FPS) ----------
  function loop(now) {
    if (lastFrame == null) lastFrame = now;
    var dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    if (running) {
      stepPhysics(dt);
      drawFrame();
      if (simT - lastChartT >= CHART_DT) {
        lastChartT = simT;
        var e = energies();
        energyChart.push(simT, [e.Ek, e.Ep, e.Et]);
        rL.set(L);
        rAmp.set(amplitudeDeg());
        rTheor.set(theoreticalPeriod());
        rMeas.set(measuredPeriod === null ? '—' : measuredPeriod);
        rTime.set(simT);
        periodFormula.set({ L: L, g: G, T: theoreticalPeriod() });
      }
    }
    // в паузе fx-канвас, приборы и график не трогаем: и картинка, и время (simT) замирают
    requestAnimationFrame(loop);
  }

  // ---------- SimUI ----------
  SimUI.title('Математический маятник');
  SimUI.slider({
    label: 'Длина нити', min: 0.5, max: 3, step: 0.05, value: L, unit: 'м',
    onChange: function (v) { L = v; }, // геометрия пересчитывается по θ,L,PPM — угол не трогаем
  });
  SimUI.slider({
    label: 'Начальная амплитуда', min: 5, max: 90, step: 1, value: ampDeg0, unit: '°',
    onChange: function (v) { ampDeg0 = v; }, // применится при следующем сбросе
  });
  SimUI.slider({
    label: 'Затухание', min: 0, max: 0.5, step: 0.01, value: damping, unit: '',
    onChange: function (v) { damping = v; },
  });
  SimUI.playPause({
    onPlay: function () { running = true; lastFrame = null; },
    onPause: function () { running = false; },
    onReset: function () { resetSim(); },
  });

  var energyChart = SimUI.chart({
    title: 'Энергия', xLabel: 't, с', yLabel: 'E, Дж',
    series: [{ name: 'кинетическая', color: '#4f8ff7' },
      { name: 'потенциальная', color: '#ffb27a' },
      { name: 'полная', color: '#8b95a3' }],
    corner: 'br',
  });
  var rL = SimUI.readout({ label: 'Длина', unit: 'м', digits: 2, corner: 'bl' });
  var rAmp = SimUI.readout({ label: 'Амплитуда', unit: '°', digits: 1, corner: 'bl' });
  var rTheor = SimUI.readout({ label: 'Период (теория)', unit: 'с', digits: 3, corner: 'bl' });
  var rMeas = SimUI.readout({ label: 'Период (измеренный)', unit: 'с', digits: 3, corner: 'bl' });
  var rTime = SimUI.readout({ label: 'Время', unit: 'с', digits: 1, corner: 'bl' });
  var periodFormula = SimUI.formula({
    title: 'Период малых колебаний',
    tex: 'T = 2\\pi\\sqrt{L/g}',
    vars: { L: { label: 'L', unit: 'м' }, g: { label: 'g', unit: 'м/с²' },
      T: { label: 'T', unit: 'с' } },
    note: 'Формула верна для малых углов; при большой амплитуде измеренный период больше теоретического.',
    corner: 'tl',
  });

  SimUI.expose({
    getState: function () {
      var e = energies();
      return { t: simT, angle: theta, omega: omega, length: L,
        kinetic: e.Ek, potential: e.Ep };
    },
    reset: resetSim,
  });

  // ---------- Инициализация ----------
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
